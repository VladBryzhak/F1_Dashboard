<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Google Search Console ownership verification -->
    <meta name="google-site-verification" content="_ZV3I2MUnRSqa7WGCMrZL_NMfhl3zoB3kAQvds1kZPE" />

    <!-- SEO -->
    <meta
      name="description"
      content="Formula 1 standings, race calendar, driver & team career stats, head-to-head comparisons and past-race telemetry — every season from 1950 to today."
    />
    <link rel="canonical" href="https://f1-dashboard-bryzhak.onrender.com/" />
    <meta property="og:site_name" content="F1 Dashboard" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="F1 Dashboard — Formula 1 Standings, Calendar & Stats" />
    <meta
      property="og:description"
      content="Championship standings, race results, driver & team career stats and telemetry — 1950 to today."
    />
    <meta property="og:url" content="https://f1-dashboard-bryzhak.onrender.com/" />
    <meta property="og:image" content="https://f1-dashboard-bryzhak.onrender.com/og/index.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="F1 Dashboard — Formula 1 Standings, Calendar & Stats" />
    <meta
      name="twitter:description"
      content="Championship standings, race results, driver & team career stats and telemetry — 1950 to today."
    />
    <meta name="twitter:image" content="https://f1-dashboard-bryzhak.onrender.com/og/index.png" />

    <!-- Installable web app (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="F1 Dashboard" />
    <!-- Warm the connection to the F1 image CDN that serves the hero (LCP) image.
         No crossorigin: images load without CORS, and only a matching
         connection gets reused. -->
    <link rel="preconnect" href="https://media.formula1.com" />
    <!-- Self-hosted fonts (public/fonts). Fetched without blocking render, then
         applied as a stylesheet; font-display: swap shows text right away. -->
    <link rel="preload" as="style" href="/fonts/fonts.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/fonts/fonts.css" /></noscript>
    <title>F1 Dashboard — Formula 1 Standings, Calendar & Stats</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
